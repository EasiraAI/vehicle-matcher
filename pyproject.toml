[project]
name = "vehicle-matcher"
version = "0.1.0"
description = "Matches free-text car descriptions to catalogue vehicles with a calibrated confidence score"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (docker compose up -d)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# word-list literals via "a b c".split() are more readable than 40-element lists
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
# inline HTML/CSS template; line-length rules don't usefully apply
"scripts/demo_server.py" = ["E501"]

[tool.mypy]
strict = true
packages = ["vehicle_matcher"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true  # optional dependency, only imported when LLM tier is enabled
