# mutmut (2.x) configuration — used by the nightly mutation-testing job.
# Scope: only the scoring and calibration logic (they are the product), and
# only the fast DB-free unit suite as the kill signal.
[mutmut]
paths_to_mutate=src/vehicle_matcher/scorer.py,src/vehicle_matcher/calibrator.py
backup=False
runner=python -m pytest -x -q tests/unit
tests_dir=tests/unit
