services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vehicles
    ports:
      # Host port 5433 to avoid colliding with a locally installed Postgres.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicles"]
      interval: 2s
      timeout: 2s
      retries: 15
